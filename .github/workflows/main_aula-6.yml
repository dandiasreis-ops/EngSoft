# Documentação oficial da Action utilizada para publicar aplicações na Azure:
# https://github.com/Azure/webapps-deploy

# Documentação das Actions da Microsoft Azure para GitHub Actions:
# https://github.com/Azure/actions

# Documentação para aplicações Python hospedadas no Azure App Service:
# https://aka.ms/python-webapps-actions

# Define o nome que aparecerá na aba Actions do GitHub
name: Build and deploy Python app to Azure Web App - Aula-6

# Define os eventos que iniciam automaticamente o workflow
on:
  # Executa o workflow quando há um push para uma branch especificada
  push:
    # Define a branch main como gatilho do workflow
    branches:
      - 'main'

  # Permite iniciar o workflow manualmente pela aba Actions
  workflow_dispatch:

# Define os jobs que compõem o pipeline
jobs:

  # Job responsável por preparar a aplicação e gerar o artefato
  build:
    # Define o ambiente virtual de execução disponibilizado pelo GitHub
    runs-on: ubuntu-latest

    # Define as permissões disponíveis para este job
    permissions:
      # Permite ler o conteúdo do repositório
      contents: read

    # Lista as etapas executadas pelo job build, na ordem definida
    steps:
      # Baixa o código do repositório para o ambiente de execução
      - uses: actions/checkout@v4

      # Define uma etapa para configurar a versão do Python
      - name: Set up Python version
        # Utiliza a Action oficial para instalar e configurar o Python
        uses: actions/setup-python@v5
        # Define os parâmetros da configuração do Python
        with:
          # Especifica a versão do Python utilizada no workflow
          python-version: '3.14'

      # Nova etapa:
      # É executada antes da instalação das dependências e do build local
      - name: Exibir mensagem de início do deploy
        # Executa um comando no terminal do ambiente do GitHub Actions
        run: echo "Iniciando o deploy do meu projeto!"

      # Etapa opcional de build local:
      # Permite identificar problemas na instalação das dependências
      # antes de enviar a aplicação para a Azure
      - name: Create and Start virtual environment and Install dependencies
        # Executa os comandos abaixo no terminal, em sequência
        run: |
          # Cria um ambiente virtual Python chamado antenv.
          python -m venv antenv
          # Ativa o ambiente virtual criado.
          source antenv/bin/activate
          # Instala as dependências declaradas em requirements.txt.
          pip install -r requirements.txt

      # A Azure pode utilizar o Oryx para instalar dependências durante
      # o deploy, caso SCM_DO_BUILD_DURING_DEPLOYMENT esteja habilitado
      
      # Por isso, o ambiente virtual antenv é excluído do artefato,
      # evitando enviar arquivos desnecessários para a Azure

      # Define a etapa responsável por armazenar os arquivos da aplicação
      - name: Upload artifact for deployment jobs
        # Utiliza a Action que publica um artefato para outros jobs
        uses: actions/upload-artifact@v4
        # Configura os parâmetros do artefato
        with:
          # Define o nome do artefato que será armazenado
          name: python-app
          # Especifica quais arquivos e pastas serão incluídos
          
          # (Abaixo) Inclui os arquivos do diretório atual.
          # (Abaixo) Exclui o ambiente virtual para reduzir o tamanho do artefato.
          path: |
            .
            !antenv/

      # Se o Oryx for desabilitado, é necessário configurar outra
      # estratégia de build e instalação das dependências na Azure

  # Job responsável por autenticar na Azure e publicar a aplicação
  deploy:
    # Executa este job em uma máquina Ubuntu disponibilizada pelo GitHub
    runs-on: ubuntu-latest

    # Garante que o job deploy só começa após o sucesso do job build
    needs: build

    # Define as permissões necessárias para autenticação e leitura
    permissions:
      # Permite solicitar um token OIDC para autenticação na Azure
      id-token: write
      # Permite ler o conteúdo do repositório
      contents: read

    # Lista as etapas de publicação da aplicação
    steps:
      # Recupera o artefato gerado pelo job build
      - name: Download artifact from build job
        # Utiliza a Action de download de artefatos do GitHub
        uses: actions/download-artifact@v4
        # Define as opções do download
        with:
          # Precisa corresponder ao nome usado no upload do artefato
          name: python-app

      # Etapa que autentica o workflow na conta Azure
      - name: Login to Azure
        # Utiliza a Action oficial de login na Azure
        uses: azure/login@v2
        # Fornece os dados necessários para a autenticação
        with:
          # Identificador do aplicativo usado na autenticação
          # Valor é obtido de um secret configurado no GitHub
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_BF13FF00C6B14E8EB6CEDC00363830ED }}

          # Identificador do tenant Microsoft Entra ID
          # O valor é armazenado nos secrets do repositório
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_183D05A939FD4ABD9BF2784E4CDB67FB }}

          # Identificador da assinatura Azure utilizada no deploy
          # Valor também é obtido dos secrets do GitHub
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E934D6F7E2194588BD6EDEA99D252E86 }}

      # Etapa responsável por enviar a aplicação para o App Service
      - name: 'Deploy to Azure Web App'
        # Utiliza a Action oficial para publicar aplicações na Azure
        uses: azure/webapps-deploy@v3

        # Define um identificador interno para essa etapa
        id: deploy-to-webapp

        # Informa os parâmetros utilizados na publicação
        with:
          # Nome do Azure App Service que receberá a aplicação
          app-name: 'Aula-6'

          # Define o slot de destino, que neste caso, é o ambiente de produção
          slot-name: 'Production'
          
